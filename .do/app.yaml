name: exam-master
region: sgp
services:
  - name: web
    github:
      repo: leodyversemilla07/exam-master
      branch: main
      deploy_on_push: true
    build_command: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    run_command: heroku-php-apache2 public/
    envs:
      - key: APP_NAME
        value: "ExamMaster"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "${APP_KEY}"
        type: SECRET
      - key: APP_URL
        value: "${APP_URL}"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: "${db.HOSTNAME}"
      - key: DB_PORT
        value: "${db.PORT}"
      - key: DB_DATABASE
        value: "${db.DATABASE}"
      - key: DB_USERNAME
        value: "${db.USERNAME}"
      - key: DB_PASSWORD
        value: "${db.PASSWORD}"
      - key: CACHE_STORE
        value: "database"
      - key: SESSION_DRIVER
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: FILESYSTEM_DISK
        value: "local"
      - key: PRISM_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        value: "${GEMINI_API_KEY}"
        type: SECRET
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080

  - name: worker
    github:
      repo: leodyversemilla07/exam-master
      branch: main
      deploy_on_push: true
    build_command: composer install --no-dev --optimize-autoloader
    run_command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    envs:
      - key: APP_NAME
        value: "ExamMaster"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "${APP_KEY}"
        type: SECRET
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        value: "${db.HOSTNAME}"
      - key: DB_PORT
        value: "${db.PORT}"
      - key: DB_DATABASE
        value: "${db.DATABASE}"
      - key: DB_USERNAME
        value: "${db.USERNAME}"
      - key: DB_PASSWORD
        value: "${db.PASSWORD}"
      - key: PRISM_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        value: "${GEMINI_API_KEY}"
        type: SECRET
    instance_count: 1
    instance_size_slug: basic-xxs

databases:
  - name: db
    engine: MYSQL
    version: "8"
    size: db-s-1vcpu-1gb
    num_nodes: 1
